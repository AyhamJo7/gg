[project]
name = "gg-orchestrator"
version = "0.1.0"
description = "AI Engineering Mission Control — orchestrates local AI CLI subscriptions"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[project.scripts]
gg-backend = "orchestrator.server:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S603", "S607"]  # subprocess exec with argv arrays is our core mechanism (documented in SECURITY.md)

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108", "ASYNC109", "ASYNC240", "E501"]  # tests: readability over line length

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true
