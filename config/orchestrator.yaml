# GG Orchestrator runtime configuration.
# Values here are defaults; per-project overrides live in <project>/.orchestrator/config.yaml

providers:
  claude:
    enabled: true
    executable: claude
    timeout_minutes: 60
  codex:
    enabled: true
    executable: codex
    timeout_minutes: 60
  agy:
    enabled: true
    executable: agy
    timeout_minutes: 60
  opencode:
    enabled: true
    executable: opencode
    # opencode's interactive default model may hang in headless runs;
    # pin a model verified to respond non-interactively.
    model: opencode-go/muse-spark-1.3-contributor
    variant: xhigh
    timeout_minutes: 60

orchestration:
  checkpoint_before_provider_switch: true
  review_required: true
  max_repair_cycles: 3
  max_phase_attempts: 4
  cooldown_base_seconds: 60
  cooldown_multiplier: 2.0
  cooldown_max_seconds: 3600
  # Distinct from the exponential reliability cooldown above: applied when a
  # spawn-handshake refusal is orchestrator-internal (not the provider's
  # fault, see ExecutionResult.gate_refused) so a persistent internal fault
  # still can't cause a zero-delay respawn loop.
  gate_refused_cooldown_seconds: 5
  max_provider_wait_seconds: 7200
  scheduler_tick_seconds: 2

scheduler:
  max_parallel_tasks: 3
  max_parallel_per_provider:
    claude: 1
    codex: 1
    agy: 1
    opencode: 1

# Role-specific provider priority (top = most preferred). Editable via UI/API.
priority:
  planning:    [claude, codex, opencode, agy]
  implementation: [opencode, codex, agy, claude]
  testing:     [codex, claude, agy, opencode]
  review:      [claude, codex, agy, opencode]
  repair:      [opencode, codex, agy, claude]

git:
  auto_checkpoint: true

security:
  # Workspace projects must resolve strictly inside one of these roots.
  # Root itself is never a valid workspace. System trees (/etc, /usr, /var, ...)
  # and sensitive directories (.ssh, .gnupg, .aws, ...) are always rejected.
  allowed_roots:
    - ~/projects
    - /tmp

server:
  host: 127.0.0.1
  port: 8787

database:
  path: .orchestrator/orchestrator.db
